      left: 0;

    }

      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* important */
      z-index: 3;
    }

    .calendar {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%; /* ou une largeur fixe si tu préfères */

      border-radius: 10px;
      text-align: center;
      font-size: 0.9rem;
      z-index: 2;
      text-shadow: 0 1px 3px rgba(255,255,255,0.5);
    }
	
    .day {
      font-size: 1.8rem;
      font-weight: bold;
      color: #a76203;
    }

    .date {
      font-size: 1.6rem;
	  margin-top: 0.3rem;
      color: #681605;
	  text-shadow: 0 1px 3px rgba(3,64,82,1);
    }

    .saint {
      font-size: 1.2rem; /* Taille normale pour le saint */

      color: #e6772a; /* Couleur rose pour les saints/événements */
    }

    .ferie {

      font-weight: bold;
    }

    .saison {
        font-weight: normal;
        color: #09896B; /* Vert plus soutenu pour les saisons */
    }
	
	/* Conteneur pour effet magique */
    .saint {
    position: relative;
    display: inline-block;
    }

    /* Poussières de fée */
    .saint.ferie::after {
    content: "";
    position: absolute;
    top: -5px;
    left: -10px;
    width: 120%;
    height: 120%;
    pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,170,0.9) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,237,221,0.8) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,230,187,0.7) 1px, transparent 1px);
    background-size: 15px 15px, 25px 25px, 20px 20px;
    animation: sparkleMove 5s linear infinite;
    opacity: 0.8;
    }

    /* Animation douce */
    @keyframes sparkleMove {
    0% {
    transform: translateY(0px) translateX(0px);
    opacity: 0.6;
   }
    50% {
    transform: translateY(-5px) translateX(3px);
    opacity: 1;
   }
   100% {
    transform: translateY(0px) translateX(0px);
    opacity: 0.6;
   }
    }

    .evenement {

        font-style: italic;

    const joursFeriesFixes = [
      "01-01", // Jour de l'an
      "05-04", // Pâques
      "06-04", // Lundi de Pâques
      "01-05", // Fête du travail
      "08-05", // Victoire 1945

    function calculerDatePaques(annee) {
        const a = annee % 19;
        const b = Math.floor(annee / 100);
        const c = annee % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + d + 7) / 12);
        const g = Math.floor((b - d - f + 21) % 30);
        const h = Math.floor((g + Math.floor(g / 28) + 5 - g % 28) % 4);
        const i = Math.floor((annee + Math.floor(annee / 4) + g + h + 2) % 7);
        const jourPaques = 28 - g - h + i;
        const moisPaques = 3 + Math.floor((g + h - i + jourPaques) / 31);
        const jour = jourPaques;
        const mois = moisPaques;
        return { jour, mois };
    }

    function getJoursFeriesPourAnnee(annee) {
        const datePaques = calculerDatePaques(annee);
        const paquesJour = datePaques.jour.toString().padStart(2, '0');
        const paquesMois = datePaques.mois.toString().padStart(2, '0');

        const lundiPaquesDate = new Date(annee, datePaques.mois - 1, datePaques.jour + 1);
        const lundiPaquesJour = lundiPaquesDate.getDate().toString().padStart(2, '0');
        const lundiPaquesMois = (lundiPaquesDate.getMonth() + 1).toString().padStart(2, '0');

        const ascensionDate = new Date(annee, datePaques.mois - 1, datePaques.jour + 39); // +39 jours après Pâques
        const ascensionJour = ascensionDate.getDate().toString().padStart(2, '0');
        const ascensionMois = (ascensionDate.getMonth() + 1).toString().padStart(2, '0');

        const pentecoteDate = new Date(annee, datePaques.mois - 1, datePaques.jour + 49); // +49 jours après Pâques
        const pentecoteJour = pentecoteDate.getDate().toString().padStart(2, '0');
        const pentecoteMois = (pentecoteDate.getMonth() + 1).toString().padStart(2, '0');

        const lundiPentecoteDate = new Date(annee, pentecoteDate.getMonth(), pentecoteDate.getDate() + 1);
        const lundiPentecoteJour = lundiPentecoteDate.getDate().toString().padStart(2, '0');
        const lundiPentecoteMois = (lundiPentecoteDate.getMonth() + 1).toString().padStart(2, '0');

        return [
            ...joursFeriesFixes,
            `${paquesJour}-${paquesMois}`,
            `${lundiPaquesJour}-${lundiPaquesMois}`,
            `${ascensionJour}-${ascensionMois}`,
            `${pentecoteJour}-${pentecoteMois}`,
            `${lundiPentecoteJour}-${lundiPentecoteMois}`
        ];
    }

    function mettreAJourEphéméride() {

        // const today = new Date(2026, 6, 14); // Exemple pour le 14 Juillet 2026
        const today = new Date(); // Utilise la date actuelle du système

        const jourSemaineIndex = today.getDay(); // 0 pour Dimanche, 1 pour Lundi, etc.
        const jourSemaine = jours[jourSemaineIndex];
        const jour = today.getDate().toString().padStart(2, '0');
        const moisIndex = today.getMonth();
        const annee = today.getFullYear();
        const dateCle = `${jour}-${(moisIndex + 1).toString().padStart(2, '0')}`;

        document.getElementById('dayName').textContent = jourSemaine;
        document.getElementById('dateText').textContent = `${jour} ${mois[moisIndex]} ${annee}`;

        let nomEvenement = "";
        let classesSaint = [];
        let estFerie = false;

        // Vérifier si la date est un jour férié
        if (joursFeriesAnnee.includes(dateCle)) {
            classesSaint.push('ferie');
            estFerie = true;
            
            // Associer le nom du jour férié s'il existe dans les saints (pour les fêtes spéciales)
            if (saints[dateCle]) {
                nomEvenement = saints[dateCle];
            } else {
                // Gestion des jours fériés sans nom spécifique dans la liste des saints
                if (dateCle === "01-01") nomEvenement = "Jour de l'An";
                else if (dateCle === "05-04") nomEvenement = "Pâques"; // Le nom peut varier selon la langue et la date exacte
                else if (dateCle === "06-04") nomEvenement = "Lundi de Pâques";
                else if (dateCle === "14-05") nomEvenement = "Ascension";
                else if (dateCle === "24-05") nomEvenement = "Pentecôte";
                else if (dateCle === "25-05") nomEvenement = "Lundi de Pentecôte";
                else if (dateCle === "14-07") nomEvenement = "Fête Nationale";
                else if (dateCle === "15-08") nomEvenement = "Assomption";
                else if (dateCle === "01-11") nomEvenement = "Toussaint";
                else if (dateCle === "11-11") nomEvenement = "Armistice";
                else if (dateCle === "25-12") nomEvenement = "Noël";
            }
        }

        // Vérifier les noms de saints ou événements spécifiques à la date
        if (saints[dateCle]) {
            // Si ce n'est pas déjà un jour férié, ajouter le nom du saint/événement
            if (!nomEvenement) {
                nomEvenement = saints[dateCle];
            }
            // Si c'est un événement saisonnier, ajouter la classe 'saison'
            if (dateCle === "20-03" || dateCle === "21-06" || dateCle === "23-09" || dateCle === "21-12") {
                classesSaint.push('saison');
                // S'assurer que les émojis sont bien inclus si présents dans le nom du saint/événement
                if (saints[dateCle].includes("🌸") || saints[dateCle].includes("🌞") || saints[dateCle].includes("🍂") || saints[dateCle].includes("❄️")) {
                    // Rien à faire, ils sont déjà dans la chaîne
                } else {
                    // Ajouter l'émoji s'il n'y est pas et que c'est un événement saisonnier
                    if (dateCle === "20-03") nomEvenement = nomEvenement.replace("Équinoxe de Printemps", "🌸 Équinoxe de Printemps");
                    else if (dateCle === "21-06") nomEvenement = nomEvenement.replace("Solstice d'Été", "🌞 Solstice d'Été");
                    else if (dateCle === "23-09") nomEvenement = nomEvenement.replace("Équinoxe d'Automne", "🍂 Équinoxe d'Automne");
                    else if (dateCle === "21-12") nomEvenement = nomEvenement.replace("Solstice d'Hiver", "❄️ Solstice d'Hiver");
                }
            }
        } else if (!nomEvenement) {
            // Si ce n'est ni un jour férié ni un saint/événement connu
            nomEvenement = "Pas d'événement particulier";
        }

        // Mettre à jour le contenu HTML
        document.getElementById('saintName').innerHTML = nomEvenement;
        document.getElementById('saintName').className = 'saint ' + classesSaint.join(' ');
        
        // ⭐ AJOUT : Appliquer la classe 'ferie' au jour de la semaine si c'est férié
        if (estFerie) {
            document.getElementById('dayName').classList.add('ferie');
        } else {
            document.getElementById('dayName').classList.remove('ferie');
        }

        // ⭐ AJOUT : Appliquer la classe 'dimanche-rouge' au jour de la semaine s'il s'agit d'un dimanche
        if (jourSemaineIndex === 0) { // 0 correspond à Dimanche dans le tableau `jours`
            document.getElementById('dayName').classList.add('dimanche-rouge');
        } else {
            document.getElementById('dayName').classList.remove('dimanche-rouge');
        }
    }

    // Mettre à jour l'éphéméride au chargement de la page
    mettreAJourEphéméride();

    // Optionnel : mettre à jour toutes les secondes si vous voulez un suivi en temps réel (rarement nécessaire pour une éphéméride)
    // setInterval(mettreAJourEphéméride, 1000);

  </script>
