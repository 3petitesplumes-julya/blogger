  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: transparent;
      overflow: hidden; /* Supprime les barres de défilement */
      width: 740px;
      height: 444px;
    }
    
    .container {
      position: relative;
      width: 740px;
      height: 444px;
    }
    
    .frame-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 740px;
      height: 444px;
      object-fit: contain;
      z-index: 2;
      pointer-events: none;
    }
    
    .video-wrapper {
      position: absolute;
      top: 0px;
      left: 0px;
      width: 740px;
      height: 444px;
      z-index: 1;
    }
    
    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="container">
    <img 
      src="https://github.com/3petitesplumes-julya/blogger/blob/main/creations/amanie/cadre-amanie.png?raw=true" 
	  alt="Cadre" 
      class="frame-image"
    >
    
    <div class="video-wrapper">
      <video autoplay loop muted playsinline>
        <source src="https://3petitesplumes-julya.github.io/blogger/creations/amanie/amanie.mp4" type="video/mp4"> 
	 </video>
    </div>
  </div>
</body>
</html>
