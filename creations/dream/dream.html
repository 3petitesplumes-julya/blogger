<!DOCTYPE html>
<html>
<head>
  <title>dream</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: transparent;
      overflow: hidden; /* Supprime les barres de défilement */
      width: 690px;
      height: 866px;
    }
    
    .container {
      position: relative;
      width: 690px;
      height: 866px;
    }
    
    .frame-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 690px;
      height: 866px;
      object-fit: contain;
      z-index: 2;
      pointer-events: none;
    }
    
    .video-wrapper {
      position: absolute;
      top: 0px;
      left: 0px;
      width: 690px;
      height: 866px;
      z-index: 1;
    }
    
    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="container">
    <img 
      src="https://github.com/3petitesplumes-julya/blogger/blob/main/creations/dream/cadre_dream.png?raw=true" 
	  alt="Cadre" 
      class="frame-image"
    >
    
    <div class="video-wrapper">
      <video autoplay loop muted playsinline>
        <source src="https://github.com/3petitesplumes-julya/blogger/raw/ac3b564f9157a14f62c43836e535eca4e7655141/creations/dream/reve.mp4" type="video/mp4"> 
	 </video>
    </div>
  </div>
</body>
</html>
